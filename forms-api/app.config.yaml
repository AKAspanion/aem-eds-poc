# Adobe App Builder: Prohance form submissions -> AEM Content Fragments.
# Values like $AEM_AUTHOR_HOST come from forms-api/.env (never committed).
application:
  runtimeManifest:
    packages:
      prohance-forms:
        license: Apache-2.0
        inputs:
          AEM_AUTHOR_HOST: $AEM_AUTHOR_HOST
          AEM_SERVICE_CREDENTIALS_JSON: $AEM_SERVICE_CREDENTIALS_JSON
          ALLOWED_ORIGINS: $ALLOWED_ORIGINS
          RATE_LIMIT_PER_HOUR: $RATE_LIMIT_PER_HOUR
          TURNSTILE_SECRET: $TURNSTILE_SECRET
          LOG_LEVEL: info
        actions:
          contact:
            function: actions/contact/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 20000
            annotations:
              require-adobe-auth: false
              final: true
              web-custom-options: true
          newsletter:
            function: actions/newsletter/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 20000
            annotations:
              require-adobe-auth: false
              final: true
              web-custom-options: true
          trial-request:
            function: actions/trial-request/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 20000
            annotations:
              require-adobe-auth: false
              final: true
              web-custom-options: true
